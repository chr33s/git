<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>git+</title>

    <!-- Which repository this build talks to, and where the API lives.
         An empty base means same-origin, which is the deployed case: the
         Worker serves both this page and `/:repo/...`. -->
    <meta name="gp-repo" content="core" />
    <meta name="gp-api-base" content="" />

    <!-- Addresses this UI used before it moved to `/hub`. Synchronous and
         ahead of everything else: the bundle would otherwise boot on the
         wrong route and paint a screen the link did not ask for. `replace`
         rather than `assign` so Back still leaves the app. Delete this once
         external `#/` links have aged out. -->
    <script>
      (function () {
        var h = location.hash;
        if (h.slice(0, 2) !== "#/") return;
        var s = h.slice(2).split("/")[0];
        if (["activity", "code", "tasks", "detail", "settings", "search"].indexOf(s) < 0) return;
        location.replace("/hub/" + h.slice(2) + location.search);
      })();
    </script>

    <!-- Settle the palette before the first paint. Inline and synchronous on
         purpose: anything that waits for the bundle shows a white flash to
         every dark-mode reader first. `tokens.css` handles the no-choice case
         through `prefers-color-scheme`, so this only applies a stored one. -->
    <script>
      try {
        var t = localStorage.getItem("gp-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {
        /* private mode: fall through to prefers-color-scheme */
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="gp-app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
