<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>git+</title>

    <!-- Which repository this build talks to, and where the API lives.
         An empty base means same-origin, which is the deployed case: the
         Worker serves both this page and `/:repo/...`. -->
    <meta name="gp-repo" content="core" />
    <meta name="gp-api-base" content="" />

    <!-- Settle the palette before the first paint. Inline and synchronous on
         purpose: anything that waits for the bundle shows a white flash to
         every dark-mode reader first. `tokens.css` handles the no-choice case
         through `prefers-color-scheme`, so this only applies a stored one. -->
    <script>
      try {
        var t = localStorage.getItem("gp-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {
        /* private mode: fall through to prefers-color-scheme */
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <gp-app></gp-app>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
