<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>git+</title>

    <!-- Which repository this build talks to, and where the API lives.
         An empty base means same-origin, which is the deployed case: the
         Worker serves both this page and `/:repo/...`. -->
    <meta name="gp-repo" content="core" />
    <meta name="gp-api-base" content="" />

    <!-- Synchronous route/theme setup, allowed by the production script policy. -->
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <div id="gp-app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
