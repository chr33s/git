name: Release

# Builds the single executable (`npm run build:sea`) on each supported
# platform for a version tag, packages and verifies it with the same tools CI
# uses, waits for CI to pass on the tagged commit, then attests the archives
# and attaches them to a *draft* GitHub Release. Publishing the draft is a
# manual step.
# The npm package is packed once; that tarball is attached to the release and
# is the exact file published with trusted publishing (OIDC) behind the `npm`
# environment.
#
# Release assets, per version:
#   git-plus-<version>-<target>.tar.gz(.sha256)  archive: binary, licenses, notices
#   git+-<target>, git+-<target>.sha             the bare executable
#   chr33s-git-<version>.tgz, ….tgz.sha          the npm package
#   SHA256SUMS                                   every checksum above

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)build, e.g. v2.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: SEA ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # The executable embeds this runtime; build and verify with the same one.
          node-version: 26
          cache: npm
      - name: Check tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match package.json version v$version"; exit 1; }
      - run: npm ci
      # A release ships Developer ID–signed, notarized macOS executables, so a
      # downloaded copy passes Gatekeeper. The certificate lives only in a
      # throwaway keychain outside the checkout (a file in it would make the
      # build dirty) and is deleted when the job ends.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "::error::secret $name is not set"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Keep the existing search list; its entries are space-free paths.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY"
      - run: npm run build:sea
        env:
          # Read by sea.build.ts on darwin only; empty elsewhere.
          MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
      - name: Check the executable matches its runner
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
      - name: Verify Developer ID signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --strict --verbose=2 dist/sea/git+
          details="$(codesign --display --verbose=4 dist/sea/git+ 2>&1)"
          echo "$details"
          grep -q "^Authority=Developer ID Application:" <<<"$details"
          grep -q "^Timestamp=" <<<"$details"
          grep -Eq "flags=0x[0-9a-f]+\(runtime\)" <<<"$details"
      # A bare executable cannot carry a stapled ticket; Gatekeeper fetches it
      # from Apple on first run. Submitted as a zip, which leaves the binary's
      # bytes (and so every checksum) unchanged.
      - name: Notarize
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "::error::secret $name is not set"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$key"
          ditto -c -k --keepParent dist/sea/git+ "$RUNNER_TEMP/git+.zip"
          xcrun notarytool submit "$RUNNER_TEMP/git+.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notary.json"
          test "$(node -p 'require(process.argv[1]).status' "$RUNNER_TEMP/notary.json")" = "Accepted"
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      # Verifies the tag names HEAD, the checkout was clean, and the embedded
      # metadata, checksum and version agree before packaging.
      - run: node tools/package-standalone.ts
      - name: Smoke test the extracted archive
        run: |
          archives=(dist/releases/git-plus-*-${{ matrix.target }}.tar.gz)
          test "${#archives[@]}" -eq 1
          (cd dist/releases && shasum -a 256 -c "$(basename "${archives[0]}").sha256")
          scratch="$(mktemp -d)"
          tar -xzf "${archives[0]}" -C "$scratch"
          installed=("$scratch"/git-plus-*)
          (cd "${installed[0]}" && shasum -a 256 -c CONTENTS.sha256)
          "${installed[0]}/git+" --version
          "${installed[0]}/git+" --build-info
      # The same verified executable, uncompressed, for a direct download.
      - name: Stage the bare executable
        working-directory: dist/releases
        run: |
          name="git+-${{ matrix.target }}"
          cp ../sea/git+ "$name"
          chmod 0755 "$name"
          shasum -a 256 "$name" > "$name.sha"
          shasum -a 256 -c "$name.sha"
      # The exact shipped archive, installed into a fresh Debian with no Node
      # or source, and exercised end to end.
      - name: Verify Linux archive in a clean container
        if: runner.os == 'Linux'
        run: |
          archives=(dist/releases/git-plus-*-${{ matrix.target }}.tar.gz)
          bash tools/verify-standalone-container.sh "${archives[0]}" "$RUNNER_TEMP/release-installation-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.tar.gz.sha256
            dist/releases/git+-${{ matrix.target }}
            dist/releases/git+-${{ matrix.target }}.sha
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: installation-${{ matrix.target }}
          path: ${{ runner.temp }}/release-installation-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  pack:
    name: Pack npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `prepack` builds dist/lib and dist/bin (with the UI and notices).
      - name: Pack
        run: |
          mkdir -p dist/package
          npm pack --pack-destination dist/package
          version="$(node -p 'require("./package.json").version')"
          tarball="chr33s-git-$version.tgz"
          test "$(ls dist/package)" = "$tarball"
          (cd dist/package && sha256sum "$tarball" > "$tarball.sha" && sha256sum -c "$tarball.sha")
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: |
            dist/package/*.tgz
            dist/package/*.tgz.sha
          if-no-files-found: error
          retention-days: 7

  # Nothing is drafted or published until CI is green on the tagged commit.
  # CI runs on the `main` push of that commit, not on the tag, so a tag on a
  # commit main never received has no run and fails here.
  ci:
    name: Wait for CI
    if: github.repository == 'chr33s/git'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"
          echo "Waiting on CI for $TAG ($sha)"
          # The main push and the tag push land together; give CI time to queue.
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --branch main --event push --commit "$sha" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            test -n "$run" && break
            sleep 10
          done
          test -n "$run" || { echo "::error::no CI run on main for $sha; push the commit to main first"; exit 1; }
          gh run watch "$run" --exit-status --interval 30 >/dev/null \
            || { echo "::error::CI run $run did not succeed"; exit 1; }
          echo "CI run $run succeeded"

  github:
    name: Draft GitHub Release
    needs: [build, pack, ci]
    if: github.repository == 'chr33s/git'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist/releases
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: package
          path: dist/releases
      - name: Verify downloaded archives
        working-directory: dist/releases
        run: |
          version="$(node -p 'require("../../package.json").version')"
          tag="${{ inputs.tag || github.ref_name }}"
          test "$tag" = "v$version"
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            test -f "git-plus-$version-$target.tar.gz"
            test -f "git+-$target"
          done
          test -f "chr33s-git-$version.tgz"
          sha256sum -c ./*.sha256 ./*.sha
          cat ./*.sha256 ./*.sha > SHA256SUMS
      - name: Attest archives
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/releases/*.tar.gz
            dist/releases/*.tgz
            dist/releases/git+-linux-x64
            dist/releases/git+-linux-arm64
            dist/releases/git+-darwin-arm64
            dist/releases/git+-darwin-x64
      - name: Verify provenance before release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        # The attestation names the run's own ref and commits: the tag on a
        # tag push, the dispatching branch on a manual re-run.
        run: |
          for archive in dist/releases/*.tar.gz dist/releases/*.tgz \
            dist/releases/git+-{linux-x64,linux-arm64,darwin-arm64,darwin-x64}; do
            gh attestation verify "$archive" \
              --bundle "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files=(
            dist/releases/*.tar.gz dist/releases/*.tar.gz.sha256
            dist/releases/git+-* dist/releases/*.tgz dist/releases/*.tgz.sha
            dist/releases/SHA256SUMS
          )
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # Never replace assets on a release people may already have downloaded.
            test "$draft" = "true" || { echo "::error::$TAG is already published"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi

  npm:
    name: Publish to npm
    needs: [build, pack, ci, github]
    if: github.repository == 'chr33s/git'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 26 ships.
          node-version: 26
          registry-url: https://registry.npmjs.org
      # The tarball the release carries, so npm serves the same bytes.
      - uses: actions/download-artifact@v6
        with:
          name: package
          path: dist/package
      - name: Verify package checksum
        working-directory: dist/package
        run: sha256sum -c ./*.tgz.sha
      - name: Resolve version and dist-tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$version"
          # npm refuses a prerelease on `latest`: 2.0.0-alpha.1 publishes as `alpha`.
          case "$version" in
            *-*) prerelease="${version#*-}"; dist_tag="${prerelease%%.*}" ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          if npm view "$(node -p 'require("./package.json").name')@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version.outputs.published != 'true'
        # A tarball publishes as packed: no lifecycle scripts run again.
        run: npm publish "dist/package/chr33s-git-${{ steps.version.outputs.version }}.tgz" --tag "${{ steps.version.outputs.dist-tag }}"
      - name: Already published
        if: steps.version.outputs.published == 'true'
        run: echo "::notice::${{ steps.version.outputs.version }} is already on npm; nothing to publish"
